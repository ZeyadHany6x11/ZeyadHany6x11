<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Key numbers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
  </defs>
  <g transform="translate(0 10)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 30" to="0 10" begin="0.2s" dur="0.9s" fill="freeze"/>
    <rect width="270" height="150" rx="20" fill="#0b1124" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="135" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#num)">20%</text>
    <text x="135" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#e2e8f0">BETTER PREDICTIVE INSIGHTS</text>
    <text x="135" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">validated at DEPI internship</text>
  </g>
  <g transform="translate(310 10)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="310 30" to="310 10" begin="0.35s" dur="0.9s" fill="freeze"/>
    <rect width="270" height="150" rx="20" fill="#0b1124" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="135" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#num)">3.3</text>
    <text x="135" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#e2e8f0">GPA OUT OF 4.0</text>
    <text x="135" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">B.Sc. Machine Learning</text>
  </g>
  <g transform="translate(620 10)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="620 30" to="620 10" begin="0.5s" dur="0.9s" fill="freeze"/>
    <rect width="270" height="150" rx="20" fill="#0b1124" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="135" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#num)">4</text>
    <text x="135" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#e2e8f0">END-TO-END PROJECTS</text>
    <text x="135" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">RAG, clustering, NLP, BI</text>
  </g>
  <g transform="translate(930 10)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6499999999999999s" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="930 30" to="930 10" begin="0.6499999999999999s" dur="0.9s" fill="freeze"/>
    <rect width="270" height="150" rx="20" fill="#0b1124" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="135" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#num)">2027</text>
    <text x="135" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#e2e8f0">GRADUATING</text>
    <text x="135" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">June, Menofia National University</text>
  </g>
</svg>
