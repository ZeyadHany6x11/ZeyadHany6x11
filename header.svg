<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zeyad Hany, Machine Learning Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a16"/><stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="0.5" stop-color="#a78bfa" stop-opacity=".15"/><stop offset="1" stop-color="#f0abfc" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".85">
      <circle cx="230" cy="110" r="125" fill="#06b6d4">
        <animate attributeName="cx" values="230;470;230" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="110;210;110" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="250" r="140" fill="#7c3aed">
        <animate attributeName="cx" values="640;520;740;640" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;120;230;250" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="100" r="120" fill="#db2777">
        <animate attributeName="cx" values="1010;860;1040;1010" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="100;230;150;100" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="#060a16" opacity=".25"/>

    <!-- status pill -->
    <g transform="translate(600 58)" text-anchor="middle">
      <rect x="-142" y="-18" width="284" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="-114" cy="0" r="5" fill="#34d399">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="8" y="5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#e2e8f0">OPEN TO REMOTE AI / ML WORK</text>
    </g>

    <!-- name -->
    <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="600" y="175" font-size="92" font-weight="800" letter-spacing="6" fill="url(#txt)">ZEYAD HANY
        <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
      </text>
      <text x="600" y="224" font-size="22" letter-spacing="11" fill="#cbd5e1">MACHINE LEARNING ENGINEER
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.4s" fill="freeze"/>
      </text>
      <text x="600" y="276" font-size="15" letter-spacing="3" fill="#94a3b8">MODELS   /   DATA PIPELINES   /   EVALUATION   /   RAG SYSTEMS
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.4s" fill="freeze"/>
      </text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
